name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt

      - name: Lint
        run: ruff check apps/api

      - name: Test
        env:
          PYTHONPATH: apps/api
        run: pytest -q
