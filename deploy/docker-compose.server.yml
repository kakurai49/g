version: "3.9"

services:
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-kakurai49/g}/api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8080
    ports:
      # If exposing directly, open 8080 on the host
      - "8080:8080"
      # When fronted by Caddy/other reverse proxy, you can comment the line above
    networks:
      - web

networks:
  web:
    driver: bridge
